     标记按 64 网格绘制后 translate(8 8) scale(.75) 居中 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Tough Leek Quant">
	<defs>
		<linearGradient id="tlq-badge" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#F04438"/>
			<stop offset="1" stop-color="#B4190E"/>
		</linearGradient>
	</defs>
	<rect x="2" y="2" width="60" height="60" fill="url(#tlq-badge)"/>
	<g transform="translate(8 8) scale(.75)">
		<path fill="#FFFFFF" d="M8.5 32.5C8.5 19.25 15.75 10.5 27.5 10.5H35.875L29.875 16.5V21.5H26.125V40H29.875V46.5L20.875 55.5H8.5Z"/>
