<!-- Tough Leek Quant 品牌主 logo — 透明底, 品牌红渐变 (双引精修版)
     概念: 两笔共用水平品牌红渐变, 中央留白勾出一根 K 线 = 行情本体
     bullish 姿态: 左笔收在下沿, 右笔起在高点, 站稳向上
     规格: 64×64 网格; 渐变水平 x 8.5→55.5, 三段 #F47971→#F04438→#D51D10
     用法: 浅色背景; 深色背景请用 logo-dark.svg / logo-white.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Tough Leek Quant">
	<defs>
		<linearGradient id="tlq-brand" x1="8.5" y1="32" x2="55.5" y2="32" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#F47971"/>
			<stop offset=".5" stop-color="#F04438"/>
			<stop offset="1" stop-color="#D51D10"/>
		</linearGradient>
	</defs>
	<!-- 左笔 -->
	<path fill="url(#tlq-brand)" d="M8.5 32.5C8.5 19.25 15.75 10.5 27.5 10.5H35.875L29.875 16.5V21.5H26.125V40H29.875V46.5L20.875 55.5H8.5Z"/>
	<!-- 右笔 -->
	<path fill="url(#tlq-brand)" d="M34.125 17.5L43.125 8.5H55.5V31.5C55.5 44.75 48.25 53.5 36.5 53.5H28.125L34.125 47.5V40H37.875V21.5H34.125Z"/>
</svg>
