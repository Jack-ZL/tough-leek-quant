[project]
name = "tlq-mcp-server"
version = "0.3.2"
description = "tough-leek-quant MCP 服务器 — 把面板开放接口暴露为 AI 可调用工具 (Model Context Protocol)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
tlq-mcp-server = "tlq_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tlq_mcp_server"]
