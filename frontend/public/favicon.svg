<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
	<!-- Tick Stock Panel favicon — 涨色红 #F04438 单色版 (与侧边栏品牌色一致)
		 32 网格小尺寸优化: 线幅加粗 (括号 3 / 影线 2.5@70%); 亮端朝上, 明暗标签页均可读 -->
	<!-- 左方括号 -->
	<path d="M10 4 L4 4 L4 28 L10 28" stroke="#F04438" stroke-width="3" stroke-linejoin="miter"/>
	<!-- 右方括号 -->
	<path d="M22 4 L28 4 L28 28 L22 28" stroke="#F04438" stroke-width="3" stroke-linejoin="miter"/>
	<!-- K 线 wick(上下影) -->
	<line x1="16" y1="7" x2="16" y2="25" stroke="#F04438" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
	<!-- K 线 body -->
	<rect x="12.5" y="9" width="7" height="10" fill="#F04438" rx="0.5"/>
</svg>
